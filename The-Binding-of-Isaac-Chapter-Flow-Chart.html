const _LK=Object.keys(LINKS).sort((a,b)=>b.length-a.length);
function linkifyHTML(t){
  const ph=[];
  for(const k of _LK){
    const esc=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    t=t.replace(new RegExp(esc,'g'),m=>{
      const i=ph.length;
      ph.push('<a href="'+LINKS[k]+'" target="_blank">'+m+'</a>');
      return '\x00'+i+'\x00';
    });
  }
  return t.replace(/\x00(\d+)\x00/g,(_,i)=>ph[parseInt(i)]);
}

  ['MOMA','MOMHEART','🔪 Knife',0,0],['MOMHEART','CORP1','',0,0],['CORP1','CORP2','',0,0],['CORP2','MOTHER','',0,0],
  ['DP2','C1','Trapdoor',1,1],['MN2','D1','Trapdoor',1,1],
  ['MOMA','W1','Trapdoor',1,'mw'],
  ['MOM','BR','⏱ < 20m',0,-1],['MOMA','BR','⏱ < 25m',0,1],
  ['MOM','SPMAU','Strange Door\nThe Polaroid / The Negative\n(after Mom)',0,'sd'],
  ['SPMAU','AD2','Ascent','up','up'],['AD2','AD1','','up','up'],['AD1','AC2','','up','up'],
  ['AC2','AC1','','up','up'],['AC1','AB2','','up','up'],['AB2','AB1','','up','up'],
  ['AB1','HOME','','up','up'],['HOME','DOGMA','','up','up'],['DOGMA','BEAST','','up','up'],
  ['HEART','BW','⏱ < 30m',0,1],['BW','HUSH','',0,0],
  ['HEART','CATH','The Polaroid',0,'sq-l'],
  ['HEART','SHEOL','The Negative',0,'sq-r'],
  ['CATH','ISAAC','',0,0],['SHEOL','SATAN','',0,0],
  ['ISAAC','CHEST','',0,0],['SATAN','DR','',0,0],
  ['CHEST','BB','',0,0],['DR','LAMB','',0,0],
  ['BB','MEGA','',0,'mg-l'],
  ['LAMB','MEGA','',0,'mg-r'],
  ['MEGA','VOID','',0,0],['VOID','DEL','',0,0],
  ['START','GREED','Separate Mode',1,-1],
];

const VE=[
  ['MOMA','VOID','5%',1,'l',20,'l'],       // outermost left, from MOMA left side
  ['MOTHER','VOID','100%',0,'l',AX,'b'],    // straight down from Mother
  ['ISAAC','VOID','15%',1,'l',185,'l'],
  ['HEART','VOID','10%',1,'l',235,'l'],
  ['BB','VOID','100%',0,'l',270,'l'],       // inner left
  ['HUSH','VOID','100%',0,'r',RX,'b'],      // straight down from Hush
  ['MOM','VOID','5%',1,'r',752,'r'],        // between Lamb and Satan on right
  ['SATAN','VOID','15%',1,'r',795,'r'],
  ['LAMB','VOID','100%',0,'r',710,'r'],     // inner right
];

const chart=document.getElementById('chart');
const totalH=r(21);
chart.style.width=W+'px';chart.style.height=totalH+'px';

const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('width',W);svg.setAttribute('height',totalH);
svg.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:3';
svg.innerHTML=`<defs>
<marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0,.5L6,2.5L0,4.5" fill="none" stroke="var(--arr)" stroke-width="1.1"/></marker>
<marker id="ad" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0,.5L6,2.5L0,4.5" fill="none" stroke="var(--arr2)" stroke-width="1.1"/></marker>
<marker id="au" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,.5L6,2.5L0,4.5" fill="none" stroke="var(--asc-b)" stroke-width="1.1"/></marker>
</defs>`;
chart.appendChild(svg);

const N={};
nodes.forEach(([id,x,y,w,h,label,cls,mk])=>{
  N[id]={x,y,w,h};
  const d=document.createElement('div');d.className='n '+cls;
  d.style.left=(x-w/2)+'px';d.style.top=(y-h/2)+'px';
  d.style.width=w+'px';d.style.height=h+'px';
  let html='<span>'+linkifyHTML(label).replace(/\n/g,'<br>')+'</span>';
  if(mk&&MARKS[mk])html+='<img class="m" src="'+MARKS[mk]+'">';
  d.innerHTML=html;chart.appendChild(d);
});

function pt(d,dash,mk,col){
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);p.setAttribute('fill','none');
  p.setAttribute('stroke',col||'var(--arr)');p.setAttribute('stroke-width','1.3');
  if(dash)p.setAttribute('stroke-dasharray','5,4');
  p.setAttribute('marker-end','url(#'+(mk||'a')+')');
  svg.appendChild(p);
}
function lb(x,y,t,anchor){
  if(!t)return;
  const lines=t.split('\n');
  const h=lines.length*11+4;
  const w=240;
  const align=anchor==='start'?'left':anchor==='end'?'right':'center';
  const fx=anchor==='start'?x:anchor==='end'?x-w:x-w/2;
  const fo=document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
  fo.setAttribute('x',fx);fo.setAttribute('y',y-7);
  fo.setAttribute('width',w);fo.setAttribute('height',h);
  fo.setAttribute('class','lk');
  const div=document.createElement('div');
  div.style.cssText="font-size:7.5px;line-height:1.2;color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;text-align:"+align+";white-space:nowrap";
  div.innerHTML=linkifyHTML(lines.join('<br>'));
  fo.appendChild(div);
  svg.appendChild(fo);
}

// "Start" label
lb(SX,Y0-22,'Start');

E.forEach(([fi,ti,label,dash,cv])=>{
  const f=N[fi],t=N[ti];if(!f||!t)return;
  const mk=dash?'ad':'a';

  if(cv==='up'){
    pt(`M${f.x},${f.y-f.h/2}L${t.x},${t.y+t.h/2}`,0,'a');
    if(label)lb(f.x+8,(f.y-f.h/2+t.y+t.h/2)/2,label,'start');
    return;
  }

  // MOMA→W1: curve that arrives as a straight horizontal line into W1 left side
  if(cv==='mw'){
    const x1=f.x+f.w/2, y1=f.y;           // right side of MOMA
    const x2=t.x-t.w/2, y2=t.y;           // left side of W1
    // Curve from MOMA down to W1 height (never dipping below), then straight horizontal line
    const straightStart=x1+100;            // x where the straight segment begins
    const cy=y1+(y2-y1)*0.75;             // control y: between MOMA and W1, never below y2
    pt(`M${x1},${y1}C${x1+40},${cy} ${straightStart-30},${y2} ${straightStart},${y2}L${x2},${y2}`,dash,mk);
    // "Trapdoor" label centered above the straight horizontal segment
    lb((straightStart+x2)/2, y2-10, 'Trapdoor');
    return;
  }

  // Strange Door: same curve as cv=1 but label positioned below
  if(cv==='sd'){
    const x1=f.x+f.w/2,y1=f.y,x2=t.x-t.w/2,y2=t.y;
    const dx=x2-x1,dy=y2-y1;
    pt(`M${x1},${y1}C${x1+dx*.35},${y1+dy*.1} ${x1+dx*.65},${y1+dy*.9} ${x2},${y2}`,0,'a');
    if(label)lb(x1+dx*.5+8,y1+12,label);
    return;
  }

  // Heart→Cathedral/Sheol: 90° with rounded corners
  if(cv==='sq-l'||cv==='sq-r'){
    const isL=cv==='sq-l';
    const x1=SX+(isL?-FORK_OX:FORK_OX), y1=f.y+f.h/2;
    const x2=t.x, y2=t.y-t.h/2;
    const ym=(y1+y2)/2;
    let d;
    if(isL){
      d=`M${x1},${y1}L${x1},${ym-R}Q${x1},${ym} ${x1-R},${ym}L${x2+R},${ym}Q${x2},${ym} ${x2},${ym+R}L${x2},${y2}`;
    }else{
      d=`M${x1},${y1}L${x1},${ym-R}Q${x1},${ym} ${x1+R},${ym}L${x2-R},${ym}Q${x2},${ym} ${x2},${ym+R}L${x2},${y2}`;
    }
    pt(d,dash,mk);
    if(label)lb((x1+x2)/2, ym-8, label);
    return;
  }

  // BB/Lamb → Mega: 90° routing with R=16 corners, from bottom center to Mega top
  if(cv==='mg-l'||cv==='mg-r'){
    const isL=cv==='mg-l';
    const x1=f.x, y1=f.y+f.h/2;  // bottom center of source
    const arriveX=SX+(isL?-FORK_OX:FORK_OX);  // arrival x on Mega top
    const y2=t.y-t.h/2;  // top of Mega
    const ym=(y1+y2)/2;  // midpoint for horizontal segment
    let d;
    if(isL){
      d=`M${x1},${y1}L${x1},${ym-R}Q${x1},${ym} ${x1+R},${ym}L${arriveX-R},${ym}Q${arriveX},${ym} ${arriveX},${ym+R}L${arriveX},${y2}`;
    }else{
      d=`M${x1},${y1}L${x1},${ym-R}Q${x1},${ym} ${x1-R},${ym}L${arriveX+R},${ym}Q${arriveX},${ym} ${arriveX},${ym+R}L${arriveX},${y2}`;
    }
    pt(d,dash,mk);
    return;
  }

  const sameCol=Math.abs(f.x-t.x)<15;
  if(cv===0&&sameCol){
    const y1=f.y+f.h/2, y2=t.y-t.h/2;
    pt(`M${f.x},${y1}L${t.x},${y2}`,dash,mk);
    if(label){const isAlt=f.x<300;lb(f.x+(isAlt?-30:16),(y1+y2)/2,label);}
    return;
  }

  let x1,y1,x2,y2;
  if(cv===1||cv===-1){x1=f.x+(cv<0?-f.w/2:f.w/2);y1=f.y;x2=t.x+(cv<0?t.w/2:-t.w/2);y2=t.y;}
  else{x1=f.x;y1=f.y+f.h/2;x2=t.x;y2=t.y-t.h/2;}
  const dx=x2-x1,dy=y2-y1;
  pt(`M${x1},${y1}C${x1+dx*.35},${y1+dy*.1} ${x1+dx*.65},${y1+dy*.9} ${x2},${y2}`,dash,mk);
  if(label){const isLeft=cv===-1&&f.x>t.x;lb(x1+dx*.5+(isLeft?-10:8),y1+dy*.4-5,label);}
});

// "Key Pieces" label
const mega=N['MEGA'],bb=N['BB'];
lb(PM, (bb.y+bb.h/2+mega.y-mega.h/2)/2-16, 'Key Pieces (Key Piece 1 + Key Piece 2)');

// Void arrows
const voidLabelY=(N['BB'].y+N['VOID'].y)/2;

VE.forEach(([fi,ti,label,dash,side,colX,startType])=>{
  const f=N[fi],t=N[ti];if(!f||!t)return;
  const mk=dash?'ad':'a';
  const isL=side==='l';

  let x1,y1;
  if(startType==='b'){x1=f.x;y1=f.y+f.h/2;}
  else{x1=isL?f.x-f.w/2:f.x+f.w/2;y1=f.y;}

  const x2=isL?t.x-t.w/2:t.x+t.w/2;
  const y2=t.y;
  let d;

  if(startType==='b'){
    if(isL){
      d=`M${x1},${y1}L${x1},${y2-R}Q${x1},${y2} ${x1+R},${y2}L${x2},${y2}`;
    }else{
      d=`M${x1},${y1}L${x1},${y2-R}Q${x1},${y2} ${x1-R},${y2}L${x2},${y2}`;
    }
  } else {
    if(isL){
      d=`M${x1},${y1}L${colX+R},${y1}Q${colX},${y1} ${colX},${y1+R}L${colX},${y2-R}Q${colX},${y2} ${colX+R},${y2}L${x2},${y2}`;
    }else{
      d=`M${x1},${y1}L${colX-R},${y1}Q${colX},${y1} ${colX},${y1+R}L${colX},${y2-R}Q${colX},${y2} ${colX-R},${y2}L${x2},${y2}`;
    }
  }

  pt(d,dash,mk);
  if(label){
    const lx=startType==='b'?x1:colX;
    lb(lx+(isL?14:-14),voidLabelY,label,isL?'start':'end');
  }
});
</script>
